<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>三個圓圈｜一段回家的旅程</title><style>
:root{--ink:#303452;--pink:#ff779b;--gold:#f6bf56;--violet:#8a83cf;--paper:#fffdfb}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:var(--ink);background:radial-gradient(circle at 12% 14%,#ffe2c7 0,transparent 35%),radial-gradient(circle at 90% 8%,#d9dcff 0,transparent 37%),linear-gradient(145deg,#fff8f0,#f5f3ff 65%,#e9f7fa);min-height:100dvh}body:before{content:'✦  ·  ✧  ·  ✦';position:fixed;top:18%;left:4%;font-size:28px;letter-spacing:80px;color:#ffc4b8;opacity:.55;pointer-events:none;animation:float 8s ease-in-out infinite}@keyframes float{50%{transform:translateY(-22px)}}.shell{max-width:1120px;margin:auto;padding:16px 18px 26px;min-height:100dvh;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;gap:12px}header strong{font-size:clamp(18px,3vw,25px)}header small{display:block;color:#7b7895;font-size:11px;letter-spacing:2px}.ghost{border:1px solid #e5deed;background:#ffffffa8;color:#575675;border-radius:18px;padding:10px 14px;cursor:pointer;font-weight:700}.main{flex:1;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:24px;align-items:center;padding:15px 0}.art{position:relative;border-radius:36px;min-height:440px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(160deg,#fff9e8bb,#e8e4ffb0);box-shadow:0 20px 70px #7774ac1e;border:1px solid #fff}.art:after{content:'';position:absolute;inset:auto -10% -42% -10%;height:60%;border-radius:50%;background:#d6e8cb80}.art svg{width:min(100%,540px);max-height:460px;z-index:1;overflow:visible}.draw{stroke-dasharray:1100;stroke-dashoffset:1100;animation:draw 1.5s ease forwards}@keyframes draw{to{stroke-dashoffset:0}}.person{transform-origin:center;animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-7px)}}.card{background:#ffffffdb;backdrop-filter:blur(15px);border:1px solid white;box-shadow:0 20px 65px #8c84a824;border-radius:30px;padding:clamp(22px,4vw,38px);animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}.eyebrow{font-size:12px;letter-spacing:2px;color:#a477aa;font-weight:900}.card h1{font-size:clamp(29px,4vw,44px);line-height:1.25;margin:14px 0}.card p{line-height:1.9;font-size:clamp(15px,1.8vw,18px);color:#64647c}.verse{background:#f7f3ff;border-left:4px solid #aa99e9;padding:12px 15px;border-radius:12px;font-size:14px;line-height:1.7;color:#6a5d88;margin:20px 0}.question{font-size:16px;font-weight:750;color:#73517b;background:#fff0f5;padding:15px;border-radius:17px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.primary{background:linear-gradient(120deg,#ff8f8e,#f46b9c);color:white;border:0;border-radius:18px;padding:14px 22px;font-weight:850;cursor:pointer;box-shadow:0 8px 22px #f7809b55}.primary:disabled{opacity:.45}.stepper{display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:12px}.dot{width:33px;height:33px;border-radius:50%;border:1px solid #ded8e8;background:#ffffffb0;color:#8a85a4;cursor:pointer;font-weight:800}.dot.active{background:#ff86a3;color:white;border-color:#ff86a3;box-shadow:0 4px 14px #ff86a34d}.foot{font-size:12px;text-align:center;color:#8c89a2;padding:12px}.prayer{padding:16px;background:#fff5e8;border-radius:18px;line-height:1.9;font-size:15px}.choice{display:block;width:100%;text-align:left;margin:9px 0;padding:13px 15px;background:#fff;border:1px solid #e8e0ec;border-radius:15px;color:#5b5476;cursor:pointer}.choice.selected{border:2px solid #ff8aa9;background:#fff1f6}.reflection{width:100%;border:1px solid #e3d9e8;border-radius:13px;padding:12px;font:inherit;resize:vertical;min-height:80px}.tiny{font-size:12px!important}.hidden{display:none!important}@media(max-width:760px){.shell{padding:12px 12px 16px}.main{grid-template-columns:1fr;gap:10px;padding:12px 0}.art{min-height:230px;border-radius:25px}.art svg{height:240px}.card{border-radius:24px;padding:20px}.card h1{font-size:27px;margin:8px 0}.card p{font-size:14px;line-height:1.7;margin:10px 0}.verse{margin:10px 0;padding:8px 12px}.question{padding:11px;font-size:14px}.actions{margin-top:12px}.primary,.ghost{padding:11px 15px}.foot{padding:8px}.stepper{margin-top:5px}.dot{width:30px;height:30px}}@media(max-height:740px) and (max-width:760px){.art{min-height:175px}.art svg{height:180px}.card{padding:15px}.card h1{font-size:24px}.card p{font-size:13px}.verse{font-size:12px}}
</style></head><body><div class="shell"><header><div><strong>♡ 三個圓圈</strong><small>THE 3 CIRCLES · 一段回家的旅程</small></div><button class="ghost" id="reset">↻ 重新開始</button></header><main class="main"><div class="art" id="art" aria-label="互動福音插畫"></div><section class="card" id="card" aria-live="polite"></section></main><nav class="stepper" id="stepper" aria-label="旅程步驟"></nav><div class="foot">輕點下一步，或使用鍵盤 ← → 切換 · 每一步都可以停下來聊聊</div></div><script>
const stages=[
{title:'每個人，都在尋找美好',tag:'01 · 故事開始',desc:'我們都渴望被愛、有盼望，與重要的人建立真實的關係。也許你曾想過：生命原本應該是什麼模樣？',verse:'「神看著一切所造的都甚好。」— 創世記1章31節',q:'對你而言，理想而美好的人生是什麼樣子？',kind:'welcome'},
{title:'神起初美好的設計',tag:'02 · GOD’S DESIGN',desc:'神創造世界，也賜給人愛、關係與生命的意義。祂的心意不是讓我們孤單掙扎，而是與祂、與人、與受造世界和好。',verse:'創世記1章27節、31節',q:'你生命中有哪些時刻，曾感受到美好與被愛？',kind:'design'},
{title:'為什麼世界會破碎？',tag:'03 · BROKENNESS',desc:'壓力、孤單、傷害、關係裂痕……我們都看得見破碎。聖經指出，當人偏離神的道路、選擇以自己為中心時，罪使人與神的關係破裂，也影響我們的生活。',verse:'「因為世人都犯了罪，虧缺了神的榮耀。」— 羅馬書3章23節',q:'你曾在哪些地方感受到生命的破碎？',kind:'broken'},
{title:'我們努力，卻常回到原點',tag:'04 · 逃離破碎',desc:'有人靠成就、金錢、娛樂、關係或別人的肯定尋找出口。這些事未必不好，卻無法從根本修復我們與神的關係。',verse:'參考羅馬書6章23節',q:'當你難過或有壓力時，通常會用什麼方式面對？',kind:'escape'},
{title:'耶穌帶來真正的盼望',tag:'05 · JESUS',desc:'神沒有任憑我們留在破碎中。耶穌來到世上，為我們的罪死在十字架上，並且復活。祂為我們開啟回到神面前的道路。',verse:'「基督照聖經所說，為我們的罪死了……第三天復活了。」— 哥林多前書15章3–4節',q:'如果神願意主動靠近你，這對你意味著什麼？',kind:'jesus'},
{title:'悔改、相信，開始新旅程',tag:'06 · 回應邀請',desc:'我們可以轉向神，承認自己需要祂，並相信耶穌的救恩。這不是靠表現換取愛，而是憑信心領受恩典，開始跟隨祂。',verse:'馬可福音1章15節；以弗所書2章8–9節',q:'你現在比較接近哪一個圓圈？你願意更認識耶穌嗎？',kind:'respond'},
{title:'在愛中恢復、成長、同行',tag:'07 · RESTORE & GROW',desc:'信靠耶穌不是故事的終點，而是新生命的起點。藉著禱告、讀經、教會團契與彼此扶持，我們學習活出神美好的心意，也把盼望分享給別人。',verse:'哥林多後書5章17–20節',q:'你希望生命中哪一個部分，能開始有新的改變？',kind:'grow'},
{title:'你願意如何回應？',tag:'08 · 自由回應',desc:'信仰是值得認真思考的選擇。你可以選擇繼續了解，也可以用自己的話向神禱告。無論現在的答案是什麼，都值得被尊重。',verse:'「凡求告主名的，就必得救。」— 羅馬書10章13節',q:'以下哪個選項最貼近你現在的心情？',kind:'prayer'}];
let index=0,selected='',note='';const $=id=>document.getElementById(id);
function base(inner,theme='warm'){let colors=theme==='dark'?['#e8e5fa','#b5b0d3']:['#fff5d3','#ffe1ad'];return `<svg viewBox="0 0 520 410" role="img" aria-label="${stages[index].title}"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="${colors[0]}"/><stop offset="1" stop-color="${colors[1]}"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#857aaf" flood-opacity=".22"/></filter></defs><circle cx="260" cy="200" r="171" fill="url(#sky)" opacity=".82"/><g>${inner}</g></svg>`}
function circle(x,y,r,color,label,content){return `<g filter="url(#shadow)"><circle class="draw" cx="${x}" cy="${y}" r="${r}" fill="${color}" fill-opacity=".25" stroke="${color}" stroke-width="8" transform="rotate(-90 ${x} ${y})"/><text x="${x}" y="${y+5}" font-size="${content.length>3?38:53}" text-anchor="middle">${content}</text><text x="${x}" y="${y+r+24}" font-size="15" font-weight="800" text-anchor="middle" fill="#51506e">${label}</text></g>`}
function character(x=260,y=185,s=1,sad=false){return `<g class="person" transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="93" rx="60" ry="17" fill="#8e88ab" opacity=".16"/><path d="M-49 80 Q-47 15 0 15 Q47 15 49 80" fill="${sad?'#9d9ab7':'#8cc9b1'}"/><circle cy="-24" r="62" fill="#ffd7b5" stroke="#e9a989" stroke-width="2"/><path d="M-60 -24 Q-71 -101 2 -94 Q67 -94 62 -24 Q35 -47 20 -68 Q-6 -40 -60 -24" fill="#69516b"/><circle cx="-22" cy="-20" r="5" fill="#4b3e52"/><circle cx="22" cy="-20" r="5" fill="#4b3e52"/>${sad?'<path d="M-15 12 Q0 0 15 12" stroke="#79586a" stroke-width="4" fill="none"/>':'<path d="M-17 7 Q0 28 17 7" stroke="#79586a" stroke-width="4" fill="none"/>'}<circle cx="-42" cy="2" r="12" fill="#f3a3a3" opacity=".5"/><circle cx="42" cy="2" r="12" fill="#f3a3a3" opacity=".5"/></g>`}
function diagram(){return `${circle(150,137,91,'#efbb51','神美好的設計','🌳')}${circle(365,137,91,'#9994b6','人生的破碎','💔')}${circle(260,310,83,'#ef8e9c','耶穌的救贖','✝️')}<path d="M242 107 Q260 92 271 107 M425 225 Q419 256 359 278 M169 278 Q126 249 121 232" fill="none" stroke="#7e7898" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 12"/>`}
function illustration(kind){let inner='';if(kind==='welcome')inner=diagram();if(kind==='design')inner=`${circle(260,180,135,'#efbc58','神的設計','🌎')}<text x="260" y="80" text-anchor="middle" font-size="27">☀️ ✨ 🌿</text>`;if(kind==='broken')inner=`${circle(260,190,145,'#9c94b6','破碎','💔')}<text x="110" y="110" font-size="36">☁️</text><text x="370" y="115" font-size="32">🌧️</text>`;if(kind==='escape')inner=`${circle(260,198,130,'#9e95bd','反覆的掙扎','😔')}<text x="100" y="100" font-size="33">💼</text><text x="376" y="100" font-size="33">🎮</text><text x="93" y="310" font-size="33">💰</text><text x="380" y="310" font-size="33">❤️</text><path class="draw" d="M140 125 Q80 210 147 272 M377 272 Q444 200 375 126" stroke="#ef8da1" stroke-width="7" fill="none" stroke-linecap="round"/>`;if(kind==='jesus')inner=`<circle cx="260" cy="205" r="150" fill="#ffe3c8" opacity=".7"/><path class="draw" d="M260 75 V307 M183 143 H337" stroke="#d98981" stroke-width="26" stroke-linecap="round"/><text x="260" y="360" font-size="22" text-anchor="middle" fill="#a46c82">愛跨越了破碎 ♡</text><text x="100" y="110" font-size="32">✨</text><text x="382" y="270" font-size="32">✨</text>`;if(kind==='respond')inner=`${character(260,183,1.12,false)}<text x="126" y="105" font-size="38">💗</text><text x="355" y="110" font-size="34">✨</text><path d="M125 310 Q260 365 395 310" stroke="#f2a7a9" stroke-width="7" fill="none" stroke-linecap="round"/>`;if(kind==='grow')inner=`${circle(260,186,137,'#8ecab0','新的生命','🌱')}<text x="105" y="100" font-size="36">🦋</text><text x="375" y="110" font-size="36">☀️</text>`;if(kind==='prayer')inner=`${character(260,180,1.05,false)}<text x="110" y="110" font-size="38">🕊️</text><text x="368" y="110" font-size="38">💛</text><text x="260" y="345" font-size="22" font-weight="bold" text-anchor="middle" fill="#936b95">每一步，都有盼望</text>`;return base(inner,kind==='broken'||kind==='escape'?'dark':'warm')}
function render(){let s=stages[index];$('art').innerHTML=illustration(s.kind);let extra='';if(s.kind==='prayer')extra=`<div id="choices"><button class="choice ${selected==='pray'?'selected':''}" data-choice="pray">🙏 我願意向神禱告</button><button class="choice ${selected==='learn'?'selected':''}" data-choice="learn">📖 我想先多了解信仰</button><button class="choice ${selected==='think'?'selected':''}" data-choice="think">🌿 我想再想一想</button></div><div id="response"></div>`;$('card').innerHTML=`<div class="eyebrow">${s.tag}</div><h1>${s.title}</h1><p>${s.desc}</p><div class="verse">${s.verse}</div><div class="question">💬 ${s.q}</div>${extra}<div class="actions"><button class="ghost" id="prev" ${index===0?'disabled':''}>← 上一步</button><button class="primary" id="next">${index===stages.length-1?'回到旅程起點 ↻':'下一步 →'}</button>${index===stages.length-1?'<button class="ghost" id="summary">查看三個圓圈</button>':''}</div>`;$('stepper').innerHTML=stages.map((v,i)=>`<button class="dot ${i===index?'active':''}" data-step="${i}" title="${v.title}" aria-label="第${i+1}步：${v.title}">${i+1}</button>`).join('');$('prev').onclick=()=>go(index-1);$('next').onclick=()=>go(index===stages.length-1?0:index+1);document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>go(+b.dataset.step));document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{selected=b.dataset.choice;render();showResponse()});if(selected&&s.kind==='prayer')showResponse();if($('summary'))$('summary').onclick=()=>go(0)}
function showResponse(){let el=$('response');if(!el)return;document.querySelectorAll('[data-choice]').forEach(b=>b.classList.toggle('selected',b.dataset.choice===selected));if(selected==='pray')el.innerHTML=`<div class="prayer"><strong>一段可以參考的禱告</strong><p>親愛的天父，我承認自己需要祢。謝謝祢愛我，差遣耶穌為我的罪死在十字架上，並且復活。我願意離開以自己為中心的道路，相信耶穌，求祢赦免我，帶領我開始新的生命。奉耶穌基督的名禱告，阿們。</p><small>禱告不是公式；重要的是出於真誠的信心。</small></div><button class="ghost" id="copyPrayer">複製禱告文</button><p class="tiny">接下來可以與基督徒朋友或教會聯繫，一起學習讀經、禱告與認識耶穌。</p>`;else if(selected==='learn')el.innerHTML=`<div class="prayer">你可以從《馬可福音》開始認識耶穌，或和一位願意傾聽的基督徒聊聊你的問題。信仰不怕提問。</div>`;else if(selected==='think')el.innerHTML=`<div class="prayer">你不需要急著做決定。可以先記下最觸動你的問題，之後再慢慢探索。</div>`;if(selected==='pray')$('copyPrayer').onclick=()=>navigator.clipboard?.writeText('親愛的天父，我承認自己需要祢。謝謝祢愛我，差遣耶穌為我的罪死在十字架上，並且復活。我願意離開以自己為中心的道路，相信耶穌，求祢赦免我，帶領我開始新的生命。奉耶穌基督的名禱告，阿們。').then(()=>{$('copyPrayer').textContent='✓ 已複製'});}
function go(i){index=Math.max(0,Math.min(stages.length-1,i));render();window.scrollTo({top:0,behavior:'smooth'})}$('reset').onclick=()=>{selected='';go(0)};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});let startX=0;document.addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX},{passive:true});document.addEventListener('touchend',e=>{let dx=e.changedTouches[0].screenX-startX;if(Math.abs(dx)>90&&!e.target.closest('button,textarea'))go(index+(dx<0?1:-1))},{passive:true});render();
</script></body></html>
